services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: askmydocs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: askmydocs
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askmydocs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
